name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build KayzeLauncher.exe
        run: scripts/build-mingw.sh build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: KAYZE Discord Quest Completer ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/KayzeLauncher.exe
