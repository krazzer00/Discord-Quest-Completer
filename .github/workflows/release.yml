name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build KayzeLauncher.exe
        run: scripts/build-mingw.sh build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KAYZE Discord Quest Completer ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: build/KayzeLauncher.exe
